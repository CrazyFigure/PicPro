<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    部署到子路径时需修改 base href，值必须以 / 开头并以 / 结尾。
    flutter build --base-href 会替换下面的占位符。
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PicPro —— 批量压缩图片、更换背景色、转换格式、按证件照规格裁剪。全部处理在浏览器内完成，图片不会上传服务器。">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PicPro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PicPro</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Rust 内核的 WASM 加载器，必须在 flutter_bootstrap.js 之前同步加载：
    它会在全局定义 wasm_bindgen，Dart 侧的 FFI 运行时初始化时即需要该符号。
    因此不能加 async/defer，否则 RustLib.init() 会因找不到符号而失败。
  -->
  <script src="pkg/picpro_core.js"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
