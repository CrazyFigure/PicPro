<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    部署到子路径时需修改 base href，值必须以 / 开头并以 / 结尾。
    flutter build --base-href 会替换下面的占位符。
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PicPro —— 批量压缩图片、更换背景色、转换格式、按证件照规格裁剪。全部处理在浏览器内完成，图片不会上传服务器。">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PicPro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PicPro</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    注意：这里**不要**手动引入 pkg/picpro_core.js。
    flutter_rust_bridge 的 initializeWasmModule 会自行向 <head> 注入该脚本
    （路径由 rust_builder 配置中的 webPrefix "pkg/" + stem "picpro_core" 决定），
    随后用 jsEval 把 wasm_bindgen 挂到 window 上，再加载 _bg.wasm。
    若在此处再写一个 <script src="pkg/picpro_core.js">，脚本会被执行两次，
    第二次因 `wasm_bindgen` 已声明而抛 SyntaxError，导致 Rust 内核无法初始化。
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
