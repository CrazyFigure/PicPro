# PicPro Web 版 nginx 配置
#
# 说明：本文件刻意**只在 server 层定义 add_header**，各 location 内一律使用
# `expires` 控制缓存。原因是 nginx 的 add_header 继承规则：
# 子层级一旦定义了自己的 add_header，就会**完全覆盖**父层级的全部 add_header，
# 而不是与之合并。若在 location 里写 add_header Cache-Control，
# 该 location 就会丢掉下面那几个必需的安全与跨源隔离头，导致页面直接不可用。
# `expires` 是独立机制，不影响 add_header 继承，因此用它来设置缓存。

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 压缩：Web 产物中 JS/WASM 体积较大，开启后首屏加载明显更快
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # ---------- 跨源隔离（不可删除） ----------
    # Rust 内核编译为**多线程 WASM**，以 SharedArrayBuffer 作为共享内存。
    # 浏览器只有在页面处于「跨源隔离」状态时才允许使用 SharedArrayBuffer，
    # 而该状态正是由下面两个响应头开启的。
    # 缺少它们时页面会直接加载失败（控制台报 SharedArrayBuffer 未定义），
    # 因此这两行属于功能必需项，不是可选的安全加固。
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WASM 的正确 MIME 类型（部分 nginx 版本的 mime.types 未内置）
    # 类型错误会禁用浏览器的流式编译，加载明显变慢
    types {
        application/wasm wasm;
    }

    # 入口文件不缓存：保证发版后用户立即拿到新版本
    location = /index.html {
        # expires -1 会同时输出 Expires 与 Cache-Control: no-cache
        expires -1;
    }

    # 带内容哈希的静态资源可长期缓存（Flutter 构建产物默认带哈希）
    location ~* \.(?:js|wasm|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    # 单页应用回退：未知路径交给 index.html，否则刷新子路由会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 容器内静态托管，无需记录每个静态请求，降低日志噪音
    access_log off;
}
