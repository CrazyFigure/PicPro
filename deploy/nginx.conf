# PicPro Web 版 nginx 配置
#
# 说明：本文件刻意**只在 server 层定义 add_header**，各 location 内一律使用
# `expires` 控制缓存。原因是 nginx 的 add_header 继承规则：
# 子层级一旦定义了自己的 add_header，就会**完全覆盖**父层级的全部 add_header，
# 而不是与之合并。若在 location 里写 add_header Cache-Control，
# 该 location 就会丢掉下面那几个必需的安全与跨源隔离头，导致页面直接不可用。
# `expires` 是独立机制，不影响 add_header 继承，因此用它来设置缓存。

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 压缩：Web 产物中 JS/WASM 体积较大，开启后首屏加载明显更快
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # ---------- 跨源隔离响应头（当前为可选项，建议保留） ----------
    # 这两个头用于开启页面的「跨源隔离」状态，从而允许使用 SharedArrayBuffer。
    # 只有多线程 WASM 才需要它们，而本项目的内核已配置为**单线程**调用
    # （见 flutter_rust_bridge.yaml 的 default_dart_async: false），
    # 因此不依赖共享内存，纯 HTTP 部署也能正常工作，这两个头不会被用到。
    # 仍然保留的原因：将来若改回多线程内核，加上这两个头即可直接生效，
    # 且它们本身对安全无副作用（浏览器在不满足条件时会忽略）。
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 关于 MIME 类型：这里刻意不写 types 块（勿加回来） ----------
    # nginx 的 `types` 指令在 server / location 层是**替换**而非合并 http 层的类型表。
    # 基础镜像已通过 `include /etc/nginx/mime.types` 提供了完整映射，
    # 其中本就包含 `application/wasm wasm`，无需另行声明。
    # 若在此处再写一个 types 块（哪怕只为补 wasm），整张类型表会被只剩该条目取代，
    # .html 随即失去映射并回落到官方镜像设置的 `default_type application/octet-stream`，
    # 结果是浏览器把 index.html 当二进制文件下载而不是渲染页面。
    # 这个现象已在真实部署中踩到过，排查成本很高，故保留本说明。

    # 入口文件不缓存：保证发版后用户立即拿到新版本
    location = /index.html {
        # expires -1 会同时输出 Expires 与 Cache-Control: no-cache
        expires -1;
    }

    # 带内容哈希的静态资源可长期缓存（Flutter 构建产物默认带哈希）
    # .wasm 也走这里：其 MIME 由 mime.types 提供，无需特殊处理
    location ~* \.(?:js|wasm|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    # 单页应用回退：未知路径交给 index.html，否则刷新子路由会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 容器内静态托管，无需记录每个静态请求，降低日志噪音
    access_log off;
}
