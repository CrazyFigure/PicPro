# PicPro 三端发布构建
#
# 触发：推送 v* 版本标签时，构建 Windows 安装包、Android APK 与 Web 静态产物。
#
# 三个平台共用同一份 Rust 内核：
# - Windows / Android：cargokit 在 flutter build 时自动交叉编译为原生动态库；
# - Web：先由 flutter_rust_bridge 编译为 WASM，再随 Flutter Web 产物一起发布。
name: Release Build

on:
  push:
    tags:
      - 'v*'
  # 允许手动触发，便于不发版也能验证三端构建是否可用
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============ 前置：内核与静态检查 ============
  verify:
    name: Verify Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run core tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Analyze Dart code
        run: |
          flutter pub get
          flutter analyze

  # ============ Android APK ============
  android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Rust 内核需要交叉编译到 Android 目标
          targets: aarch64-linux-android

      - name: Setup Android NDK
        # cargokit 通过 ANDROID_NDK_HOME 定位 NDK 来完成 Rust 交叉编译
        run: |
          set -e
          NDK_VERSION="26.1.10909125"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Resolve release version
        shell: bash
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # 手动触发时用 0.0.0 占位，避免产出看起来像正式版本的文件名
            VERSION="0.0.0-dev"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::发布标签必须形如 v主版本.次版本.修订号"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Detect signing secrets
        # 未配置密钥库时不静默回退到 debug 签名，而是明确降级为「仅供测试」的产物，
        # 避免用户把测试包当成正式包分发（debug 签名的包无法被正式包覆盖安装）
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次产出为测试签名包，不可用于正式分发"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "keystore 已还原"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --release --target-platform android-arm64
          --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "PicPro-${VERSION}.apk"
          echo "APK renamed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicPro-Android
          path: PicPro-*.apk

      - name: Upload APK to Release
        # 仅在正式签名时上传到 Release，测试签名包只作为工作流产物保留
        if: steps.signing.outputs.enabled == 'true' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: PicPro-*.apk
          fail_on_unmatched_files: false

  # ============ Windows EXE ============
  windows:
    name: Build Windows EXE
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Resolve release version
        shell: bash
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        # cargokit 会在此步骤内自动编译 Rust 内核为 Windows 动态库
        run: >-
          flutter build windows --release --build-name "$env:VERSION"
          --build-number "$GITHUB_RUN_NUMBER"

      - name: Install NSIS
        run: choco install nsis -y

      - name: Package installer
        shell: bash
        run: |
          set -e
          mkdir -p dist
          echo "=== 探测 makensis ==="
          MAKENSIS="$(command -v makensis 2>/dev/null || true)"
          if [ -z "$MAKENSIS" ]; then
            for p in "/c/Program Files (x86)/NSIS/makensis.exe" \
                     "/c/Program Files/NSIS/makensis.exe" \
                     "/c/ProgramData/chocolatey/bin/makensis.exe"; do
              if [ -f "$p" ]; then MAKENSIS="$p"; break; fi
            done
          fi
          if [ -z "$MAKENSIS" ]; then
            echo "::error::makensis not found"
            exit 1
          fi
          echo "using makensis: $MAKENSIS"
          # NSIS 的 File /r 仅对绝对 Windows 路径可靠，OutFile 同理
          RELEASE_DIR="$(cygpath -w "$GITHUB_WORKSPACE/build/windows/x64/runner/Release")"
          OUTPUT_EXE="$(cygpath -w "$GITHUB_WORKSPACE/dist/PicPro-Setup-$VERSION.exe")"
          ICON_EXE="$(cygpath -w "$GITHUB_WORKSPACE/installers/installer.ico")"
          "$MAKENSIS" -DVERSION="$VERSION" -DAPP_NAME="PicPro" \
            -DOUTPUT="$OUTPUT_EXE" \
            -DSOURCE="$RELEASE_DIR" \
            -DMUI_ICON_PATH="$ICON_EXE" \
            installers/windows.nsi
          ls -la dist/

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicPro-Windows
          path: dist/PicPro-Setup-*.exe

      - name: Upload EXE to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PicPro-Setup-*.exe
          fail_on_unmatched_files: false

  # ============ Web（供 1Panel 等静态托管） ============
  web:
    name: Build Web
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Rust (nightly)
        # Web 端必须使用 nightly：内核编译为多线程 WASM（依赖共享内存），
        # 需要 `-Z build-std` 重建标准库，因此还要 rust-src 组件。
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Install dependencies
        run: flutter pub get

      - name: Build Rust to WASM
        run: flutter_rust_bridge_codegen build-web --release

      - name: Build Flutter web
        run: flutter build web --release

      - name: Zip web output
        run: |
          cd build/web
          zip -r ../../PicPro-Web.zip .
          cd ../..

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicPro-Web
          path: PicPro-Web.zip

      - name: Upload Web to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: PicPro-Web.zip
          fail_on_unmatched_files: false
