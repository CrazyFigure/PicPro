# PicPro 三端发布构建 + 镜像自动推送
#
# 触发方式：
#   - 推送 v* 版本标签：构建 Windows 安装包、Android APK、Web 产物并发布到 Release，
#     同时推送带版本号的镜像（1.0.0 / 1.0 / latest）
#   - 推送到 main 分支：只构建 Web 产物并推送 edge 镜像（用于快速验证与尝鲜部署）
#   - 手动触发：与标签方式相同，但版本号为占位值，产物仅作工作流附件
#
# 三个平台共用同一份 Rust 内核：
#   - Windows / Android：cargokit 在 flutter build 时自动交叉编译为原生动态库；
#   - Web：先由 flutter_rust_bridge 编译为 WASM，再随 Flutter Web 产物一起发布，
#     该产物同时被复用于构建 Docker 镜像。
name: Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# 同一分支/标签上重复触发时取消旧运行，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 前置：内核与静态检查 ============
  verify:
    name: Verify Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run core tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Analyze Dart code
        run: |
          flutter pub get
          flutter analyze

  # ============ Web 产物（镜像与 Release 共用） ============
  web:
    name: Build Web
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Rust (nightly)
        # Web 端必须使用 nightly：内核编译为多线程 WASM（依赖共享内存），
        # 需要 `-Z build-std` 重建标准库，因此还要 rust-src 组件。
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Install dependencies
        run: flutter pub get

      - name: Build Rust to WASM
        run: flutter_rust_bridge_codegen build-web --release

      - name: Build Flutter web
        run: flutter build web --release

      - name: Upload web dist
        # 目录形式上传，供 docker 任务直接取用（无需解压）
        uses: actions/upload-artifact@v4
        with:
          name: picpro-web-dist
          path: build/web
          retention-days: 7

      - name: Zip web output
        if: github.ref_type == 'tag'
        run: |
          cd build/web
          zip -r ../../PicPro-Web.zip .
          cd ../..

      - name: Upload Web to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: PicPro-Web.zip
          fail_on_unmatched_files: false

  # ============ Android APK ============
  android:
    name: Build Android APK
    needs: verify
    # 仅在发版或手动触发时构建：APK 构建耗时较长，日常 main 推送不必重复跑
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Rust 内核需要交叉编译到 Android 目标
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: Setup Android NDK
        # cargokit 通过 ANDROID_NDK_HOME 定位 NDK 来完成 Rust 交叉编译
        run: |
          set -e
          NDK_VERSION="26.1.10909125"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Resolve release version
        shell: bash
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::发布标签必须形如 v主版本.次版本.修订号"
              exit 1
            fi
          else
            # 手动触发时用 0.0.<运行序号>：既是纯数字（NSIS 的 VIProductVersion
            # 要求 X.X.X.X 格式，带 -dev 之类后缀会直接编译失败），
            # 又能区分每次构建，且一眼可辨不是正式版本
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Detect signing secrets
        # 未配置密钥库时不静默回退到 debug 签名后仍上传 Release——
        # debug 签名的包无法被正式包覆盖安装，会被用户误当成正式包。
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次产出为测试签名包，不可用于正式分发"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "keystore 已还原"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --release --target-platform android-arm64
          --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"

      - name: Verify APK signature
        # 硬校验产物证书指纹，杜绝静默回退到 debug 签名——
        # 签名不一致的包无法覆盖安装，用户会一直卡在旧版本却看不出原因。
        # 该指纹对应密钥库中的 picpro 别名；更换密钥库时必须同步更新此处。
        if: steps.signing.outputs.enabled == 'true'
        env:
          EXPECTED_SHA256: '68:CE:CC:CE:B9:F6:C5:1E:31:BE:81:9B:DE:B7:CA:A7:0D:EB:05:43:7E:B9:CF:BD:AD:A2:A1:F6:78:6F:41:7F'
        run: |
          set -e
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n1)"
          echo "使用 apksigner: $APKSIGNER"
          CERTS="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          echo "$CERTS"
          # apksigner 输出的指纹为无分隔小写十六进制，需归一化后比较
          EXPECTED_NORM="$(echo "$EXPECTED_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')"
          if echo "$CERTS" | tr -d ' ' | tr 'A-Z' 'a-z' | grep -q "sha-256digest:$EXPECTED_NORM"; then
            echo "签名证书校验通过"
          else
            echo "::error::APK 签名证书与预期不符，可能回退到了 debug 签名，已中止发布"
            exit 1
          fi

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "PicPro-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicPro-Android
          path: PicPro-*.apk

      - name: Upload APK to Release
        # 仅在正式签名且为版本标签时上传 Release
        if: steps.signing.outputs.enabled == 'true' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: PicPro-*.apk
          fail_on_unmatched_files: false

  # ============ Windows EXE ============
  windows:
    name: Build Windows EXE
    needs: verify
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Resolve release version
        shell: bash
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::发布标签必须形如 v主版本.次版本.修订号"
              exit 1
            fi
          else
            # 手动触发时用 0.0.<运行序号>：NSIS 的 VIProductVersion 要求
            # X.X.X.X 纯数字格式（脚本会拼成 ${VERSION}.0），
            # 带 -dev 之类后缀会让 makensis 直接报错退出
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        # cargokit 会在此步骤内自动编译 Rust 内核为 Windows 动态库。
        # 注意本步骤在 Windows 上默认由 PowerShell 执行，环境变量必须写 $env:NAME，
        # 写成 $NAME 会被当成未定义变量展开为空值，导致 flutter 报参数缺失。
        run: >-
          flutter build windows --release --build-name "$env:VERSION"
          --build-number "$env:GITHUB_RUN_NUMBER"

      - name: Install NSIS
        run: choco install nsis -y

      - name: Package installer
        shell: bash
        run: |
          set -e
          mkdir -p dist
          MAKENSIS="$(command -v makensis 2>/dev/null || true)"
          if [ -z "$MAKENSIS" ]; then
            for p in "/c/Program Files (x86)/NSIS/makensis.exe" \
                     "/c/Program Files/NSIS/makensis.exe" \
                     "/c/ProgramData/chocolatey/bin/makensis.exe"; do
              if [ -f "$p" ]; then MAKENSIS="$p"; break; fi
            done
          fi
          if [ -z "$MAKENSIS" ]; then
            echo "::error::makensis not found"
            exit 1
          fi
          echo "using makensis: $MAKENSIS"
          # NSIS 的 File /r 仅对绝对 Windows 路径可靠，OutFile 同理
          RELEASE_DIR="$(cygpath -w "$GITHUB_WORKSPACE/build/windows/x64/runner/Release")"
          OUTPUT_EXE="$(cygpath -w "$GITHUB_WORKSPACE/dist/PicPro-Setup-$VERSION.exe")"
          ICON_EXE="$(cygpath -w "$GITHUB_WORKSPACE/installers/installer.ico")"
          "$MAKENSIS" -DVERSION="$VERSION" -DAPP_NAME="PicPro" \
            -DOUTPUT="$OUTPUT_EXE" \
            -DSOURCE="$RELEASE_DIR" \
            -DMUI_ICON_PATH="$ICON_EXE" \
            installers/windows.nsi
          ls -la dist/

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicPro-Windows
          path: dist/PicPro-Setup-*.exe

      - name: Upload EXE to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PicPro-Setup-*.exe
          fail_on_unmatched_files: false

  # ============ Docker 镜像推送到 Docker Hub ============
  docker:
    name: Push Docker Image
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        # 未配置凭据时跳过而非失败：这样即使还没建好仓库 Secret，
        # 安装包与 Web 产物仍能正常发布，不因镜像环节阻塞整个发版
        id: creds
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，已跳过镜像推送"
          fi

      - name: Download web dist
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: picpro-web-dist
          path: build/web

      - name: Verify web dist
        # 前置校验：产物没取到时立刻失败并说清原因，
        # 否则会拖到 docker build 阶段才报一句难以定位的 COPY 失败
        if: steps.creds.outputs.enabled == 'true'
        run: |
          set -e
          if [ ! -f build/web/index.html ]; then
            echo "::error::未取到 Web 产物（build/web/index.html 不存在），无法构建镜像"
            exit 1
          fi
          echo "Web 产物就绪："
          ls -1 build/web | head -15
          du -sh build/web

      - name: Set up QEMU
        # arm64 镜像需要借助 QEMU 打包（仅复制静态文件，不涉及重编译，因此很快）
        if: steps.creds.outputs.enabled == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.creds.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        if: steps.creds.outputs.enabled == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/picpro
          # 标签策略：
          #   v1.2.3 标签 -> 1.2.3 / 1.2 / latest
          #   main 分支   -> edge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.ref_name == 'main' }}

      - name: Build and push
        if: steps.creds.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          # 只做「拷贝静态文件 + nginx」，因此可以轻松产出多架构镜像
          file: deploy/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: steps.creds.outputs.enabled == 'true'
        run: |
          echo "### 已推送镜像" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
